name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Production target is PostgreSQL 16 (schema validated on 16.14).
        # Local dev may run newer; CI pins the deployment truth.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bizsuite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: bizsuite
      PGUSER: postgres
      PGPASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend (typecheck + vite build)
        run: npm run build:web

      - name: Load schema
        run: psql -h localhost -U postgres -d bizsuite -v ON_ERROR_STOP=1 -f schema.sql
        env:
          PGPASSWORD: ci

      - name: Apply migrations (v2 deltas on top of schema.sql)
        run: npm run migrate

      - name: Integration suite (quote-to-cash spine)
        run: npm run test:integration

      - name: Auth suite
        run: npm run test:auth

      - name: RBAC suite
        run: npm run test:rbac

      - name: Frontend suite (Vitest)
        run: npm run test:web

      - name: Masters suite
        run: npm run test:masters

      - name: Quotations suite
        run: npm run test:quotations

      - name: Sales orders suite
        run: npm run test:sales-orders

      - name: Accounting suite
        run: npm run test:accounting

      - name: Journal entries suite
        run: npm run test:journals

      - name: Financial periods suite
        run: npm run test:periods

      - name: Khata rail suite
        run: npm run test:khata

      - name: Concurrency test (parallel submitters, one winner)
        run: npx tsx test/concurrency.ts

      - name: Numbering suite (FY series, C-08)
        run: npm run test:numbering

      - name: Config suite (effective-dated config, C-14)
        run: npm run test:config

      - name: Business suite (business_id everywhere, owner role)
        run: npm run test:business

      - name: Security suite (headers, CSRF, login limits, D-143)
        run: npm run test:security

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (golden staff journey against built SPA)
        run: npm run test:e2e
